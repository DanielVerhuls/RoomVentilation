# WebSockets start as an HTTP request with "Upgrade: websocket"; these headers must be
# passed through explicitly, otherwise nginx speaks plain HTTP to the solver.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    # Docker's (and later Kubernetes') internal DNS resolves the service names.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sim/ {
        proxy_pass http://solver:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Container health check (Docker now, Kubernetes probes later) - not worth logging.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
