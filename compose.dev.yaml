# Development override: mount the source code and auto-reload on changes.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    volumes:
      - ./services/api/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true" # file events do not cross from Windows into the container
    ports:
      - "8000:8000" # also expose directly, e.g. for http://localhost:8000/docs

  solver:
    volumes:
      - ./services/solver/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"

  web:
    volumes:
      - ./services/web/public:/usr/share/nginx/html:ro
